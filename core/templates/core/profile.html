<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile List</title>
</head>
<body>
    <h2>Profile List</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Job</th>
                <th>Date of Birth</th>
            </tr>
        </thead>
        <tbody>
            {% for profile in profiles %}
            <tr>
                <td>{{ profile.name }}</td>
                <td>{{ profile.lastname }}</td>
                <td>{{ profile.age }}</td>
                <td>{{ profile.job }}</td>
                <td>{{ profile.date_of_birth }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No profiles found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
